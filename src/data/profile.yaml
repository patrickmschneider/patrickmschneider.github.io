# Home page bio. Each item is a paragraph. Markdown links [like this](https://…) work.
bio:
  - I'm an Assistant Professor in Economics at [Imperial Business School](https://www.imperial.ac.uk/business-school/).
  - I'm interested in the intersection of macroeconomics, household finance and public economics. My recent work focuses on unconventional stabilisation policies like early access to retirement accounts.
  - I completed my PhD at the London School of Economics, and I previously worked as an economist at the Bank of England.

